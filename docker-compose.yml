services:
  # Application database. Migrations run against it on app startup (entrypoint).
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - app
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    # Internal-only. Uncomment for local debugging (e.g. drizzle studio, psql).
    ports:
      - "2005:5432"
    # S3-compatible object storage for app file uploads/documents.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - app
    command: server /data --console-address ":9001"
    # Root creds derived from the app's S3 credentials (single source of truth in .env).
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    # `mc` ships inside the image and has a built-in `local` alias
    # (http://localhost:9000); `mc ready` hits the unauthenticated health API.
    # Required: `minio-init` gates on `service_healthy`.
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Internal-only. Uncomment for local debugging (9000 = S3 API, 9001 = console).
    ports:
      - "2004:9000"
      - "2003:9001"
    # One-shot: waits for MinIO, then creates the app bucket (idempotent).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - app
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: 
    entrypoint: >
      /bin/sh -c " until mc alias set local http://minio:9000 \"$${S3_ACCESS_KEY_ID}\" \"$${S3_SECRET_ACCESS_KEY}\"; do
        echo 'waiting for minio...'; sleep 2;
      done; mc mb --ignore-existing local/\"$${S3_BUCKET}\"; echo 'minio bucket ready'; "

  # The TanStack Start app (SSR server). Runs DB migrations on startup, then serves.
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # VITE_ vars are baked into the client bundle at build time (read from .env).
        VITE_BASE_URL: ${VITE_BASE_URL:-http://localhost:2001}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - app
    # Wait for the DB (migrations need it) and the bucket (uploads need it).
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # All app config/secrets come from .env; only compose-controlled values are
    # set under `environment:` below (those override .env).
    env_file:
      - .env
    # Only compose-controlled values live here (these override .env).
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      RUN_MIGRATIONS: "true"
    ports:
      - "2001:3000"

networks:
  app:
    driver: bridge

volumes:
  pgdata:
  miniodata:
